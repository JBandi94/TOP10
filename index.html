<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
  <title>لعبة TOP 10</title>
  <!-- Socket.IO Client for Backend Integration -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Container replicating a mobile screen on PC */
    .app-container {
      width: 100%;
      max-width: 430px; /* Standard Mobile Width */
      height: 100vh;
      max-height: 932px; /* Standard Mobile Height */
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    /* ==========================================
       PAGES & TRANSITIONS
       ========================================== */
    .page {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 20px;
      overflow-y: auto;
    }

    .page.active {
      display: flex;
    }

    /* ==========================================
       UI COMPONENTS & TYPOGRAPHY
       ========================================== */
    h1.title {
      text-align: center;
      font-size: 2.2rem;
      color: #f59e0b;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      margin-bottom: 5px;
    }

    p.welcome-text {
      text-align: center;
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #3b82f6;
    }

    .btn {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; color: #fff; width: 100%; margin-top: auto; padding: 15px; font-size: 1.1rem; }
    .btn-success:hover { background: #15803d; }
    .btn-secondary { background: #475569; color: #fff; }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 15px;
      min-height: 20px;
    }
    .status-msg.success { color: #22c55e; }
    .status-msg.error { color: #ef4444; }
    .status-msg.connecting { color: #eab308; }

    /* Timer Settings */
    .timer-control-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .time-adjuster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-step {
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      border-radius: 8px;
    }

    /* ==========================================
       GAME BOARD (PAGE 2, 3, 4)
       ========================================== */
    .game-header {
      text-align: center;
      margin-bottom: 15px;
    }

    .domain-box {
      background: linear-gradient(90deg, #d97706, #f59e0b);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 15px;
    }

    /* Words Grid Layout: 2 Columns (1-5 and 6-10) */
    .words-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }

    .word-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .word-card {
      background: #334155;
      border: 1px solid #475569;
      height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      position: relative;
      overflow: hidden;
    }

    .word-card.revealed {
      background: #1e3a8a;
      border-color: #3b82f6;
    }

    .word-card .num {
      width: 22px;
      height: 22px;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #f59e0b;
      margin-left: 6px;
      flex-shrink: 0;
    }

    .word-card .text {
      flex: 1;
      font-size: 0.85rem;
      font-weight: bold;
      text-align: center;
      color: transparent;
    }

    .word-card.revealed .text, .word-card.unfound .text {
      color: #fff;
    }

    .word-card.unfound {
      background: #7f1d1d;
      border-color: #ef4444;
    }

    .word-card .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #fff;
      flex-shrink: 0;
    }

    /* Progress Bar */
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 1s linear, background-color 0.3s ease;
    }

    /* Leaderboard */
    .leaderboard-title {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .leaderboard-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      padding: 8px;
      max-height: 160px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 8px;
      gap: 10px;
    }

    .leaderboard-item .rank {
      font-weight: bold;
      color: #f59e0b;
      width: 18px;
      font-size: 0.85rem;
    }

    .leaderboard-item img {
      width: 26px;
      height: 26px;
      border-radius: 50%;
    }

    .leaderboard-item .nickname {
      flex: 1;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leaderboard-item .score {
      font-weight: bold;
      color: #22c55e;
      font-size: 0.85rem;
    }

    /* ==========================================
       MODAL & WINNER OVERLAY
       ========================================== */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      width: 100%;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      max-height: 90%;
      display: flex;
      flex-direction: column;
    }

    .winner-box {
      margin: 15px 0;
      padding: 15px;
      background: linear-gradient(135deg, #78350f, #b45309);
      border-radius: 12px;
    }

    .winner-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-bottom: 8px;
    }
  </style>

<body>

<div class="app-container">

  <!-- ================= PAGE 1: SETUP ================= -->
  <div id="page-1" class="page active">
    <h1 class="title">TOP 10</h1>
    <p class="welcome-text">مرحبا بكم في لعبة TOP 10</p>

    <div class="input-group">
      <input type="text" id="tiktok-user" placeholder="اسم مستخدم التيكتوك (مثال: @username)">

      <button class="btn btn-primary" id="btn-start-round" style="width: 100%;">بداية الجولة الأولى</button>
    </div>

    <div id="game-board" style="display: none; flex-direction: column; flex: 1;">
      <div id="domain-title" class="domain-box">المجال: ---</div>

      <!-- Words Layout: 2 Columns -->
      <div class="words-grid">
        <div class="word-column" id="col-1">
          <!-- 1 to 5 -->
        </div>
        <div class="word-column" id="col-2">
          <!-- 6 to 10 -->
        </div>
      </div>

      <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="leaderboard-title">
        <span>ترتيب المشاركين</span>
        <span id="player-count">0 مشارك</span>
      </div>

        <!-- Live Leaderboard Items -->

      <button class="btn btn-success" id="btn-next-round" style="display: none;">الانتقال للجولة التالية</button>
    </div>

  <!-- ================= FINAL RESULTS MODAL ================= -->
  <div id="final-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 style="color: #f59e0b;">🏆 النتيجة النهائية 🏆</h2>
      <div id="winner-container" class="winner-box">
        <!-- Winner details rendered dynamically -->
      </div>
      <div class="leaderboard-title">ترتيب باقي المراكز</div>

<script>
/* ==========================================================================
   GAME STATE & CONFIGURATION
   ========================================================================== */
const STATE = {
  socket: null,
  isConnected: false,
  tiktokUser: '',
  timerEnabled: true,
  timerSeconds: 100,
  currentRound: 1, // 1, 2, or 3
  domainData: null,
  scores: {}, // { username: { nickname, avatar, score } }
  revealedWords: [],
  roundTimer: null,
  timeRemaining: 0,
  roundActive: false
};

/* Mock Database Backup - System prevents repeating domains */
let domainBank = [
  {
    domain: "عواصم عربية",
    words: ["الرياض", "القاهرة", "الجزائر", "الرباط", "تونس", "عمان", "دمشق", "بغداد", "الخرطوم", "أبوظبي"]
  },
  {
    domain: "عناصر كيميائية",
    words: ["هيدروجين", "أكسجين", "نيتروجين", "كاربوون", "حديد", "ذهب", "فضة", "نحاس", "ألومنيوم", "يورانيوم"]
  },
  {
    domain: "كواكب المجموعة الشمسية",
    words: ["عطارد", "الزهراء", "الأرض", "المريخ", "المشتري", "زحل", "أورانوس", "نبتون", "بلوتو", "الشمس"]
  }
];

/* ==========================================================================
   DOM ELEMENTS
   ========================================================================== */
const $ = (id) => document.getElementById(id);

/* ==========================================================================
   ARABIC TEXT NORMALIZATION & MATCHING LOGIC
   ========================================================================== */
function normalizeArabic(text) {
  if (!text) return '';
  return text
    .trim()
    .replace(/[أإآٱ]/g, 'ا')        // Normalize Alif
    .replace(/[ةه]$/g, 'ه')          // Normalize Ta Marbouta & Ha at end
    .replace(/[\u064B-\u0652]/g, '')  // Remove Tashkeel
    .replace(/^ال/, '');             // Strip AL-Definition
}

// Check distance/similarity (1 letter difference allowed: ج / غ / ق etc.)
function isSimilar(s1, s2) {
  const n1 = normalizeArabic(s1);
  const n2 = normalizeArabic(s2);

  if (n1 === n2) return true;

  // Single word compound check
  if (n1.length > 2 && n2.length > 2) {
    let diffs = 0;
    if (Math.abs(n1.length - n2.length) <= 1) {
      const maxLen = Math.max(n1.length, n2.length);
      let minLen = Math.min(n1.length, n2.length);
      for (let i = 0; i < minLen; i++) {
        if (n1[i] !== n2[i]) diffs++;
      }
      diffs += Math.abs(n1.length - n2.length);
      if (diffs <= 1) return true;
    }
  }
  return false;
}

/* Compound word handler helper */
function matchAnswer(comment, correctWord) {
  const normComment = normalizeArabic(comment);
  const normCorrect = normalizeArabic(correctWord);

  // Direct or fuzzy match
  if (isSimilar(normComment, normCorrect)) return true;

  // Split compound words
  const parts = normCorrect.split(' ').filter(p => p.length > 0);
  if (parts.length > 1) {
    for (let part of parts) {
      if (isSimilar(normComment, part)) return true;
    }
  }
  return false;
}

/* ==========================================================================
   POINTS SYSTEM
   ========================================================================== */
function getPointsForIndex(index) {
  if (index >= 0 && index <= 2) return 1;  // Words 1-3
  if (index >= 3 && index <= 5) return 2;  // Words 4-6
  if (index >= 6 && index <= 8) return 3;  // Words 7-9
  if (index === 9) return 4;               // Word 10
  return 0;
}

/* ==========================================================================
   UI CONTROLLERS & EVENT HANDLERS
   ========================================================================== */

// Connection Logic
$('btn-connect').addEventListener('click', () => {
  const user = $('tiktok-user').value.trim();
  const status = $('connection-status');
  if (!user) {
    status.className = 'status-msg error';
    status.innerText = 'يرجى إدخال اسم المستخدم!';
    return;
  }

  status.className = 'status-msg connecting';
  status.innerText = 'جاري محاولة الاتصال بالبث...';

  // Socket connection to local or hosted server.js
  if (typeof io !== 'undefined') {
    if (STATE.socket) {
      try { STATE.socket.disconnect(); } catch (_) {}
    }
    STATE.socket = io({ transports: ['websocket', 'polling'] });
    let tiktokConnectTimeout = setTimeout(() => {
      if (!STATE.isConnected) {
        status.className = 'status-msg error';
        status.innerText = 'انتهت مهلة الاتصال. تحقق من اسم المستخدم وأن البث مباشر ثم حاول مرة أخرى.';
      }
    }, 30000);
    STATE.socket.on('tiktok-connected', () => {
      clearTimeout(tiktokConnectTimeout);

    STATE.socket.on('tiktok-connected', () => {
      STATE.isConnected = true;
      status.className = 'status-msg success';
      status.innerText = 'تم الاتصال بالبث بنجاح! جاهز للتحدي.';
    });

    STATE.socket.on('tiktok-error', (err) => {
      clearTimeout(tiktokConnectTimeout);
      STATE.isConnected = false;
      status.className = 'status-msg error';
      status.innerText = 'فشل الاتصال: ' + (err.message || 'تأكد من اسم المستخدم أو حالة البث.');
    });

    // Handle incoming chat comments
    STATE.socket.on('chat', (data) => {
      if (STATE.roundActive) {
        processIncomingComment(data.uniqueId, data.nickname, data.profilePictureUrl, data.comment);
      }
    });
  } else {
    // Offline / Test Fallback
    setTimeout(() => {
      STATE.isConnected = true;
      status.className = 'status-msg success';
      status.innerText = 'تم الاتصال الافتراضي (وضع الاختبار المحلي).';
    }, 1000);
  }
});

// Timer Settings Adjusters
$('timer-toggle').addEventListener('change', (e) => {
  STATE.timerEnabled = e.target.checked;
  $('timer-input-wrapper').style.opacity = STATE.timerEnabled ? '1' : '0.4';
  $('timer-input-wrapper').style.pointerEvents = STATE.timerEnabled ? 'auto' : 'none';
});

$('btn-time-minus').addEventListener('click', () => {
  let v = parseInt($('timer-value').value) || 100;
  if (v > 10) $('timer-value').value = v - 10;
});

$('btn-time-plus').addEventListener('click', () => {
  let v = parseInt($('timer-value').value) || 100;
  $('timer-value').value = v + 10;
});

// Start Game -> Move to Page 2
$('btn-start-game').addEventListener('click', () => {
  STATE.timerSeconds = parseInt($('timer-value').value) || 100;
  $('page-1').classList.remove('active');$('page-game').classList.add('active');
  setupRoundUI();
});

/* ==========================================================================
   ROUND MANAGEMENT
   ========================================================================== */
function setupRoundUI() {
  const roundBtn = $('btn-start-round');
  roundBtn.style.display = 'block';
  roundBtn.innerText = `بداية الجولة ${getArabicOrdinal(STATE.currentRound)}`;
  $('game-board').style.display = 'none';$('btn-next-round').style.display = 'none';
  
  if (!STATE.timerEnabled) {
    $('progress-container').style.display = 'none';
  }
}

function getArabicOrdinal(num) {
  return num === 1 ? 'الأولى' : num === 2 ? 'الثانية' : 'الثالثة';
}

$('btn-start-round').addEventListener('click', async () => {
  $('btn-start-round').disabled = true;
  $('btn-start-round').innerText = 'جاري تحميل المجال...';

  await loadQuestionFromServer();

  $('btn-start-round').style.display = 'none';
  $('game-board').style.display = 'flex';
  STATE.revealedWords = new Array(10).fill(null);
  STATE.roundActive = true;

  renderBoard();
  startRoundTimer();
});

async function loadQuestionFromServer() {
  try {
    const response = await fetch('/api/question/random', {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const question = await response.json();

    if (!question || !Array.isArray(question.words) || question.words.length < 10) {
      throw new Error('بيانات المجال غير صالحة');
    }

    STATE.domainData = {
      id: question.id ?? null,
      domain: question.domain || question.category || 'مجال',
      category: question.category || question.domain || 'مجال',
      words: question.words.slice(0, 10)
    };

    STATE.revealedWords = new Array(10).fill(null);
    return true;
  } catch (error) {
    console.error('فشل تحميل المجال من الخادم:', error);

    // احتياطياً: نستعمل البيانات المحلية إذا تعذر الوصول إلى MongoDB.
    STATE.domainData = domainBank[(STATE.currentRound - 1) % domainBank.length];
    STATE.revealedWords = new Array(10).fill(null);
    return false;
  }
}

function renderBoard() {
  $('domain-title').innerText = `المجال: ${STATE.domainData.domain}`;
  
  const col1 = $('col-1');
  const col2 = $('col-2');
  col1.innerHTML = '';
  col2.innerHTML = '';

  for (let i = 0; i < 10; i++) {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.id = `word-card-${i}`;

    const num = document.createElement('div');
    num.className = 'num';
    num.innerText = i + 1;

    const text = document.createElement('div');
    text.className = 'text';
    text.innerText = STATE.domainData.words[i];

    card.appendChild(num);
    card.appendChild(text);

    if (STATE.revealedWords[i]) {
      card.classList.add('revealed');
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = STATE.revealedWords[i].avatar;
      card.appendChild(img);
    }

    if (i < 5) col1.appendChild(card);
    else col2.appendChild(card);
  }
}

/* ==========================================================================
   ANSWER PROCESSING LOGIC
   ========================================================================== */
function processIncomingComment(username, nickname, avatar, comment) {
  if (!STATE.roundActive) return;

  STATE.domainData.words.forEach((correctWord, index) => {
    // If word is not revealed yet
    if (!STATE.revealedWords[index]) {
      if (matchAnswer(comment, correctWord)) {
        // Reveal word
        const playerAvatar = avatar || 'https://via.placeholder.com/30';
        STATE.revealedWords[index] = { username, nickname, avatar: playerAvatar };

        // Award points
        const pts = getPointsForIndex(index);
        if (!STATE.scores[username]) {
          STATE.scores[username] = { nickname: nickname || username, avatar: playerAvatar, score: 0 };
        }
        STATE.scores[username].score += pts;

        // Update Card UI
        const card = $(`word-card-${index}`);
        if (card) {
          card.classList.add('revealed');
          const img = document.createElement('img');
          img.className = 'avatar';
          img.src = playerAvatar;
          card.appendChild(img);
        }

        updateLeaderboardUI();
        checkRoundEnd();
      }
    }
  });
}

function checkRoundEnd() {
  const allFound = STATE.revealedWords.every(w => w !== null);
  if (allFound) {
    endRound();
  }
}

/* ==========================================================================
   TIMER & ROUND END
   ========================================================================== */
function startRoundTimer() {
  if (!STATE.timerEnabled) return;

  STATE.timeRemaining = STATE.timerSeconds;
  const bar = $('progress-bar');
  bar.style.width = '100%';
  bar.style.backgroundColor = '#22c55e';

  clearInterval(STATE.roundTimer);
  STATE.roundTimer = setInterval(() => {
    STATE.timeRemaining--;
    const pct = (STATE.timeRemaining / STATE.timerSeconds) * 100;
    bar.style.width = `${pct}%`;

    if (pct < 30) bar.style.backgroundColor = '#ef4444';
    else if (pct < 60) bar.style.backgroundColor = '#eab308';

    if (STATE.timeRemaining <= 0) {
      clearInterval(STATE.roundTimer);
      endRound();
    }
  }, 1000);
}

function endRound() {
  STATE.roundActive = false;
  clearInterval(STATE.roundTimer);

  // Reveal unfound words
  for (let i = 0; i < 10; i++) {
    if (!STATE.revealedWords[i]) {
      const card = $(`word-card-${i}`);
      if (card) card.classList.add('unfound');
    }
  }

  const nextBtn = $('btn-next-round');
  nextBtn.style.display = 'block';

  if (STATE.currentRound < 3) {
    nextBtn.innerText = 'الانتقال للجولة التالية';
  } else {
    // End of Round 3 - Hide Leaderboard & Prepare Final Result Button
    $('leaderboard-list').style.display = 'none';
    nextBtn.innerText = 'إظهار النتيجة النهائية';
  }
}

$('btn-next-round').addEventListener('click', () => {
  if (STATE.currentRound < 3) {
    STATE.currentRound++;
    setupRoundUI();
  } else {
    showFinalResults();
  }
});

/* ==========================================================================
   LEADERBOARD & FINAL MODAL
   ========================================================================== */
function updateLeaderboardUI() {
  const list = $('leaderboard-list');
  list.innerHTML = '';

  const sorted = Object.values(STATE.scores).sort((a, b) => b.score - a.score);
  $('player-count').innerText = `${sorted.length} مشارك`;

  sorted.forEach((player, idx) => {
    const item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = `
      <span class="rank">${idx + 1}</span>
      <img src="${player.avatar}" alt="p">
      <span class="nickname">${player.nickname}</span>
      <span class="score">${player.score} ن</span>
    `;
    list.appendChild(item);
  });
}

function showFinalResults() {
  const modal = $('final-modal');
  modal.style.display = 'flex';

  const sorted = Object.values(STATE.scores).sort((a, b) => b.score - a.score);
  const winnerContainer = $('winner-container');
  const finalLeaderboard = $('final-leaderboard');

  finalLeaderboard.innerHTML = '';

  if (sorted.length > 0) {
    const winner = sorted[0];
    winnerContainer.innerHTML = `
      <img class="winner-avatar" src="${winner.avatar}">
      <h3 style="color: #fff;">🥇 ${winner.nickname}</h3>
      <p style="color: #f59e0b; font-weight: bold; margin-top: 5px;">مجموع النقاط: ${winner.score}</p>
    `;

    // Remaining rankings
    sorted.slice(1).forEach((player, idx) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      item.innerHTML = `
        <span class="rank">${idx + 2}</span>
        <img src="${player.avatar}" alt="p">
        <span class="nickname">${player.nickname}</span>
        <span class="score">${player.score} ن</span>
      `;
      finalLeaderboard.appendChild(item);
    });
  } else {
    winnerContainer.innerHTML = '<p style="color: #fff;">لم يتم تسجيل أي نقاط في هذه اللعبة.</p>';
  }
}

// Reset Game / New Game
$('btn-new-game').addEventListener('click', () => {
  STATE.currentRound = 1;
  STATE.scores = {};
  $('final-modal').style.display = 'none';$('leaderboard-list').style.display = 'flex';
  $('page-game').classList.remove('active');$('page-1').classList.add('active');
});
</script>
