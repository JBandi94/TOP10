<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>لعبة TOP 10</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #020617;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    /* إطار هاتف افتراضي للحاسوب ومريح للهاتف */
    .phone-wrapper {
      width: 100%;
      max-width: 450px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      height: 92vh;
      max-height: 880px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .page {
      display: none;
      flex-direction: column;
      height: 100%;
      padding: 16px;
      overflow-y: auto;
    }

    .page.active {
      display: flex;
    }

    h1.title {
      text-align: center;
      font-size: 2rem;
      color: #f59e0b;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      margin-bottom: 4px;
    }

    p.welcome-text {
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      text-align: center;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: #3b82f6;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn-primary { 
      background: #2563eb; 
      color: #fff; 
    }
    .btn-primary:hover { 
      background: #1d4ed8; 
    }
    .btn-primary:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-success { 
      background: #16a34a; 
      color: #fff; 
      width: 100%; 
      margin-top: auto; 
      padding: 14px; 
      font-size: 1rem; 
    }
    .btn-success:hover { 
      background: #15803d; 
    }
    .btn-success:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-secondary { 
      background: #475569; 
      color: #fff; 
    }

    .status-msg {
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 15px;
      min-height: 20px;
    }
    .status-msg.success { color: #22c55e; }
    .status-msg.error { color: #ef4444; }
    .status-msg.connecting { color: #eab308; }

    .timer-control-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .time-adjuster {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-step {
      width: 36px;
      height: 36px;
      font-size: 1.1rem;
      border-radius: 8px;
    }

    .domain-box {
      background: linear-gradient(90deg, #d97706, #f59e0b);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      margin-bottom: 12px;
    }

    /* شبكة متناسقة للكلمات دون التسبب في سكجول عرضي */
    .words-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
      width: 100%;
    }

    .word-column {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .word-card {
      background: #334155;
      border: 1px solid #475569;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }

    .word-card.revealed {
      background: #1e3a8a;
      border-color: #3b82f6;
    }

    .word-card .num {
      width: 22px;
      height: 22px;
      background: #0f172a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #f59e0b;
      margin-left: 4px;
      flex-shrink: 0;
    }

    .word-card .text {
      flex: 1;
      font-size: 0.8rem;
      font-weight: bold;
      text-align: center;
      color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 2px;
    }

    .word-card.revealed .text, 
    .word-card.unfound .text {
      color: #fff;
    }

    .word-card.unfound {
      background: #7f1d1d;
      border-color: #ef4444;
    }

    .word-card .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #fff;
      flex-shrink: 0;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: #22c55e;
      transition: width 1s linear, background-color 0.3s ease;
    }

    .leaderboard-title {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .leaderboard-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 10px;
      padding: 6px;
      max-height: 180px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      background: #1e293b;
      padding: 6px 8px;
      border-radius: 8px;
      gap: 8px;
    }

    .leaderboard-item .rank {
      font-weight: bold;
      color: #f59e0b;
      width: 16px;
      font-size: 0.8rem;
    }

    .leaderboard-item img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
    }

    .leaderboard-item .nickname {
      flex: 1;
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .leaderboard-item .score {
      font-weight: bold;
      color: #22c55e;
      font-size: 0.8rem;
    }

    .modal-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-card {
      background: #1e293b;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      width: 100%;
      padding: 16px;
      text-align: center;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      max-height: 90%;
      display: flex;
      flex-direction: column;
    }

    .winner-box {
      margin: 12px 0;
      padding: 12px;
      background: linear-gradient(135deg, #78350f, #b45309);
      border-radius: 12px;
    }

    .winner-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #fff;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

<div class="phone-wrapper">
  <div class="app-container">

    <!-- ================= PAGE 1: SETUP ================= -->
    <div id="page-1" class="page active">
      <h1 class="title">TOP 10</h1>
      <p class="welcome-text">مرحبا بكم في لعبة TOP 10</p>

      <div class="input-group">
        <input type="text" id="tiktok-user" placeholder="اسم مستخدم التيكتوك (@username)">
        <button class="btn btn-primary" id="btn-connect">إتصال</button>
      </div>
      <div id="connection-status" class="status-msg"></div>

      <div class="timer-control-box">
        <label class="checkbox-label">
          <input type="checkbox" id="timer-toggle" checked>
          تفعيل المؤقت للجولات
        </label>
        <div class="time-adjuster" id="timer-input-wrapper">
          <button class="btn btn-secondary btn-step" id="btn-time-minus">-</button>
          <input type="number" id="timer-value" value="100" min="10" max="600">
          <button class="btn btn-secondary btn-step" id="btn-time-plus">+</button>
        </div>
      </div>

      <button class="btn btn-success" id="btn-start-game" disabled>ابدأ التحدي</button>
    </div>

    <!-- ================= PAGE 2: GAME ROUNDS ================= -->
    <div id="page-game" class="page">
      <div class="game-header" style="margin-bottom: 10px;">
        <button class="btn btn-primary" id="btn-start-round" style="width: 100%;">بداية الجولة الأولى</button>
      </div>

      <div id="game-board" style="display: none; flex-direction: column; flex: 1; min-height: 0;">
        <div id="domain-title" class="domain-box">المجال: ---</div>

        <div class="words-grid">
          <div class="word-column" id="col-1"></div>
          <div class="word-column" id="col-2"></div>
        </div>

        <div class="progress-bar-container" id="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="leaderboard-title">
          <span>ترتيب المشاركين</span>
          <span id="player-count">0 مشارك</span>
        </div>
        <div class="leaderboard-list" id="leaderboard-list"></div>

        <button class="btn btn-success" id="btn-next-round" style="display: none; margin-top: 10px;">الانتقال للجولة التالية</button>
      </div>
    </div>

    <!-- ================= FINAL RESULTS MODAL ================= -->
    <div id="final-modal" class="modal-overlay">
      <div class="modal-card">
        <h2 style="color: #f59e0b; font-size: 1.3rem;">🏆 النتيجة النهائية 🏆</h2>
        <div id="winner-container" class="winner-box"></div>
        <div class="leaderboard-title">ترتيب باقي المراكز</div>
        <div class="leaderboard-list" id="final-leaderboard" style="max-height: 180px; margin-bottom: 12px;"></div>
        <button class="btn btn-primary" id="btn-new-game" style="width: 100%;">لعبة جديدة</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ==========================================================================
   GAME STATE & CONFIGURATION
   ========================================================================== */
const STATE = {
  socket: null,
  isConnected: false,
  tiktokUser: '',
  timerEnabled: true,
  timerSeconds: 100,
  currentRound: 1,
  domainData: null,
  scores: {}, // يختزن نقاط كل لاعب بالمعرف: { username: { nickname, avatar, score } }
  revealedWords: [],
  roundTimer: null,
  timeRemaining: 0,
  roundActive: false
};

const $ = (id) => document.getElementById(id);

/* ==========================================================================
   ARABIC TEXT NORMALIZATION & MATCHING
   ========================================================================== */
function normalizeArabic(text) {
  if (!text) return '';
  return text
    .trim()
    .toLowerCase()
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/[ةه]$/g, 'ه')
    .replace(/[\u064B-\u0652]/g, '')
    .replace(/^ال/, '');
}

function isSimilar(s1, s2) {
  const n1 = normalizeArabic(s1);
  const n2 = normalizeArabic(s2);
  if (n1 === n2) return true;

  if (n1.length > 2 && n2.length > 2) {
    let diffs = 0;
    if (Math.abs(n1.length - n2.length) <= 1) {
      const minLen = Math.min(n1.length, n2.length);
      for (let i = 0; i < minLen; i++) {
        if (n1[i] !== n2[i]) diffs++;
      }
      diffs += Math.abs(n1.length - n2.length);
      if (diffs <= 1) return true;
    }
  }
  return false;
}

function matchAnswer(comment, correctWord) {
  const normComment = normalizeArabic(comment);
  const normCorrect = normalizeArabic(correctWord);
  if (isSimilar(normComment, normCorrect)) return true;

  const parts = normCorrect.split(' ').filter(p => p.length > 0);
  if (parts.length > 1) {
    for (let part of parts) {
      if (isSimilar(normComment, part)) return true;
    }
  }
  return false;
}

/* ==========================================================================
   POINTS SYSTEM ACCORDING TO WORD RANKING
   الترتيب 1 - 3: نقطة واحدة
   الترتيب 4 - 6: نقطتان
   الترتيب 7 - 9: 3 نقاط
   الترتيب 10: 4 نقاط
   ========================================================================== */
function getPointsForIndex(index) {
  if (index >= 0 && index <= 2) return 1;
  if (index >= 3 && index <= 5) return 2;
  if (index >= 6 && index <= 8) return 3;
  if (index === 9) return 4;
  return 0;
}

/* ==========================================================================
   SOCKET.IO CONNECTION
   ========================================================================== */
function initSocket() {
  STATE.socket = io({
    autoConnect: true,
    transports: ['websocket', 'polling'],
    reconnection: true,
    reconnectionAttempts: 5,
    reconnectionDelay: 1000
  });

  STATE.socket.on('connect', () => {
    console.log('[Socket.IO] connected:', STATE.socket.id);
  });

  STATE.socket.on('disconnect', () => {
    STATE.isConnected = false;
    $('btn-start-game').disabled = true;
    setTikTokStatus('error', 'انقطع اتصال صفحة اللعبة بالخادم.');
  });

  STATE.socket.on('connect_error', (err) => {
    console.error('[Socket.IO] connection error:', err);
    setTikTokStatus('error', 'تعذر الاتصال بخادم اللعبة.');
  });

  STATE.socket.on('tiktok-status', (data = {}) => {
    if (data.success) {
      STATE.isConnected = true;
      STATE.tiktokUser = data.uniqueId || STATE.tiktokUser;
      setTikTokStatus('success', data.message || 'تم الاتصال بالبث بنجاح! جاهز للتحدي.');
      $('btn-start-game').disabled = false;
    } else {
      STATE.isConnected = false;
      $('btn-start-game').disabled = true;
      if (data.message?.includes('جاري')) {
        setTikTokStatus('connecting', data.message);
      } else {
        setTikTokStatus('error', data.message || 'فشل الاتصال.');
      }
    }
  });

  STATE.socket.on('tiktok-disconnected', (data = {}) => {
    STATE.isConnected = false;
    $('btn-start-game').disabled = true;
    setTikTokStatus('error', data.message || 'تم قطع الاتصال بالبث.');
  });

  STATE.socket.on('chat', (data) => {
    if (STATE.roundActive) {
      processIncomingComment(
        data.uniqueId, 
        data.nickname, 
        data.avatarKey ? `/avatar?id=${data.avatarKey}` : (data.profilePictureUrl || ''), 
        data.comment
      );
    }
  });
}

function setTikTokStatus(type, message) {
  const status = $('connection-status');
  status.className = 'status-msg ' + type;
  status.innerText = message;
}

/* ==========================================================================
   EVENT HANDLERS
   ========================================================================== */
$('btn-connect').addEventListener('click', () => {
  const user = $('tiktok-user').value.trim();
  if (!user) {
    setTikTokStatus('error', 'يرجى إدخال اسم المستخدم!');
    return;
  }
  if (!STATE.socket) {
    setTikTokStatus('error', 'تعذر تشغيل اتصال Socket.IO في الصفحة.');
    return;
  }
  if (!STATE.socket.connected) {
    setTikTokStatus('connecting', 'جاري الاتصال بخادم اللعبة...');
    STATE.socket.connect();
    return;
  }
  STATE.isConnected = false;
  STATE.tiktokUser = user.replace(/^@+/, '').trim();
  $('btn-start-game').disabled = true;
  setTikTokStatus('connecting', 'جاري محاولة الاتصال بالبث...');
  STATE.socket.emit('connect-tiktok', { uniqueId: STATE.tiktokUser });
});

$('timer-toggle').addEventListener('change', (e) => {
  STATE.timerEnabled = e.target.checked;
  $('timer-input-wrapper').style.opacity = STATE.timerEnabled ? '1' : '0.4';
  $('timer-input-wrapper').style.pointerEvents = STATE.timerEnabled ? 'auto' : 'none';
});

$('btn-time-minus').addEventListener('click', () => {
  let v = parseInt($('timer-value').value) || 100;
  if (v > 10) $('timer-value').value = v - 10;
});

$('btn-time-plus').addEventListener('click', () => {
  let v = parseInt($('timer-value').value) || 100;
  if (v < 600) $('timer-value').value = v + 10;
});

$('btn-start-game').addEventListener('click', () => {
  if (!STATE.isConnected) {
    setTikTokStatus('error', 'يجب الاتصال ببث TikTok أولاً قبل بدء التحدي.');
    return;
  }
  STATE.timerSeconds = parseInt($('timer-value').value) || 100;
  $('page-1').classList.remove('active');$('page-game').classList.add('active');
  setupRoundUI();
});

/* ==========================================================================
   ROUND MANAGEMENT
   ========================================================================== */
function setupRoundUI() {
  const roundBtn = $('btn-start-round');
  roundBtn.style.display = 'block';
  roundBtn.disabled = false;
  roundBtn.innerText = `بداية الجولة ${getArabicOrdinal(STATE.currentRound)}`;
  $('game-board').style.display = 'none';$('btn-next-round').style.display = 'none';
  
  if (!STATE.timerEnabled) {
    $('progress-container').style.display = 'none';
  } else {
    $('progress-container').style.display = 'block';
  }
}

function getArabicOrdinal(num) {
  return num === 1 ? 'الأولى' : num === 2 ? 'الثانية' : 'الثالثة';
}

$('btn-start-round').addEventListener('click', async () => {$('btn-start-round').disabled = true;
  $('btn-start-round').innerText = 'جاري تحميل المجال...';

  const loaded = await loadQuestionFromServer();
  if (!loaded) {
    $('btn-start-round').disabled = false;
    $('btn-start-round').innerText = 'إعادة المحاولة';
    return;
  }

  $('btn-start-round').style.display = 'none';$('game-board').style.display = 'flex';
  STATE.revealedWords = new Array(10).fill(null);
  STATE.roundActive = true;

  renderBoard();
  startRoundTimer();
});

async function loadQuestionFromServer() {
  try {
    const response = await fetch('/api/question/random', {
      method: 'GET',
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const question = await response.json();
    if (!question || !Array.isArray(question.words) || question.words.length < 10) {
      throw new Error('بيانات المجال غير صالحة');
    }
    STATE.domainData = {
      id: question.id ?? null,
      domain: question.domain || question.category || 'مجال',
      category: question.category || question.domain || 'مجال',
      words: question.words.slice(0, 10)
    };
    STATE.revealedWords = new Array(10).fill(null);
    return true;
  } catch (error) {
    console.error('فشل تحميل المجال من الخادم:', error);
    const fallbackIndex = (STATE.currentRound - 1) % 3;
    const fallbacks = [
      { domain: 'عواصم عربية', words: ['الرياض', 'القاهرة', 'الجزائر', 'الرباط', 'تونس', 'عمان', 'دمشق', 'بغداد', 'الخرطوم', 'أبوظبي'] },
      { domain: 'فواكه', words: ['تفاح', 'برتقال', 'موز', 'عنب', 'فراولة', 'بطيخ', 'خوخ', 'مشمش', 'رمان', 'كرز'] },
      { domain: 'حيوانات مفترسة', words: ['أسد', 'نمر', 'فهد', 'ذئب', 'ضبع', 'دب', 'وشق', 'تمساح', 'قرش', 'أفعى'] }
    ];
    STATE.domainData = fallbacks[fallbackIndex];
    STATE.revealedWords = new Array(10).fill(null);
    return true;
  }
}

function renderBoard() {
  $('domain-title').innerText = `المجال: ${STATE.domainData.domain}`;
  const col1 = $('col-1');
  const col2 = $('col-2');
  col1.innerHTML = '';
  col2.innerHTML = '';

  for (let i = 0; i < 10; i++) {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.id = `word-card-${i}`;
    const num = document.createElement('div');
    num.className = 'num';
    num.innerText = i + 1;
    const text = document.createElement('div');
    text.className = 'text';
    text.innerText = STATE.domainData.words[i];
    card.appendChild(num);
    card.appendChild(text);
    if (i < 5) col1.appendChild(card);
    else col2.appendChild(card);
  }
}

/* ==========================================================================
   ANSWER PROCESSING & MULTI-PLAYER SCORING
   ========================================================================== */
function processIncomingComment(username, nickname, avatar, comment) {
  if (!STATE.roundActive || !STATE.domainData) return;

  STATE.domainData.words.forEach((correctWord, index) => {
    // التحقق أن الكلمة لم تكشف بعد
    if (!STATE.revealedWords[index]) {
      if (matchAnswer(comment, correctWord)) {
        const playerAvatar = avatar || 'https://via.placeholder.com/30';

        // تسجيل من كشف الكلمة
        STATE.revealedWords[index] = { 
          username, 
          nickname: nickname || username, 
          avatar: playerAvatar 
        };

        // حساب نقاط الكلمة وإضافتها لرصيد هذا اللاعب المحدد
        const pts = getPointsForIndex(index);
        if (!STATE.scores[username]) {
          STATE.scores[username] = { 
            nickname: nickname || username, 
            avatar: playerAvatar, 
            score: 0 
          };
        }
        STATE.scores[username].score += pts;

        // تحديث كارت الكلمة في الواجهة
        const card = $(`word-card-${index}`);
        if (card) {
          card.classList.add('revealed');
          const img = document.createElement('img');
          img.className = 'avatar';
          img.src = playerAvatar;
          img.onerror = () => { img.src = 'https://via.placeholder.com/30'; };
          card.appendChild(img);
        }

        updateLeaderboardUI();
        checkRoundEnd();
      }
    }
  });
}

function checkRoundEnd() {
  const allFound = STATE.revealedWords.every(w => w !== null);
  if (allFound) endRound();
}

/* ==========================================================================
   TIMER & ROUND END
   ========================================================================== */
function startRoundTimer() {
  if (!STATE.timerEnabled) return;
  STATE.timeRemaining = STATE.timerSeconds;
  const bar = $('progress-bar');
  bar.style.width = '100%';
  bar.style.backgroundColor = '#22c55e';
  clearInterval(STATE.roundTimer);
  STATE.roundTimer = setInterval(() => {
    STATE.timeRemaining--;
    const pct = (STATE.timeRemaining / STATE.timerSeconds) * 100;
    bar.style.width = `${pct}%`;
    if (pct < 30) bar.style.backgroundColor = '#ef4444';
    else if (pct < 60) bar.style.backgroundColor = '#eab308';
    if (STATE.timeRemaining <= 0) {
      clearInterval(STATE.roundTimer);
      endRound();
    }
  }, 1000);
}

function endRound() {
  STATE.roundActive = false;
  clearInterval(STATE.roundTimer);
  for (let i = 0; i < 10; i++) {
    if (!STATE.revealedWords[i]) {
      const card = $(`word-card-${i}`);
      if (card) {
        card.classList.add('unfound');
        const text = card.querySelector('.text');
        if (text) text.style.color = '#fff';
      }
    }
  }
  const nextBtn = $('btn-next-round');
  nextBtn.style.display = 'block';
  if (STATE.currentRound < 3) {
    nextBtn.innerText = 'الانتقال للجولة التالية';
  } else {
    $('leaderboard-list').style.display = 'none';
    nextBtn.innerText = 'إظهار النتيجة النهائية';
  }
}

$('btn-next-round').addEventListener('click', () => {
  if (STATE.currentRound < 3) {
    STATE.currentRound++;
    $('leaderboard-list').style.display = 'flex';
    setupRoundUI();
  } else {
    showFinalResults();
  }
});

/* ==========================================================================
   LEADERBOARD & FINAL MODAL
   ========================================================================== */
function updateLeaderboardUI() {
  const list = $('leaderboard-list');
  list.innerHTML = '';
  // ترتيب اللاعبين تنازلياً حسب مجموع نقاطهم
  const sorted = Object.values(STATE.scores).sort((a, b) => b.score - a.score);
  $('player-count').innerText = `${sorted.length} مشارك`;
  
  sorted.forEach((player, idx) => {
    const item = document.createElement('div');
    item.className = 'leaderboard-item';
    item.innerHTML = `
      <span class="rank">${idx + 1}</span>
      <img src="${player.avatar}" alt="p" onerror="this.src='https://via.placeholder.com/26'">
      <span class="nickname">${escapeHtml(player.nickname)}</span>
      <span class="score">${player.score} ن</span>
    `;
    list.appendChild(item);
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showFinalResults() {
  const modal = $('final-modal');
  modal.style.display = 'flex';
  const sorted = Object.values(STATE.scores).sort((a, b) => b.score - a.score);
  const winnerContainer = $('winner-container');
  const finalLeaderboard = $('final-leaderboard');
  finalLeaderboard.innerHTML = '';

  if (sorted.length > 0) {
    const winner = sorted[0];
    winnerContainer.innerHTML = `
      <img class="winner-avatar" src="${winner.avatar}" onerror="this.src='https://via.placeholder.com/60'">
      <h3 style="color: #fff;">🥇 ${escapeHtml(winner.nickname)}</h3>
      <p style="color: #f59e0b; font-weight: bold; margin-top: 5px;">مجموع النقاط النهائي: ${winner.score}</p>
    `;
    sorted.slice(1).forEach((player, idx) => {
      const item = document.createElement('div');
      item.className = 'leaderboard-item';
      item.innerHTML = `
        <span class="rank">${idx + 2}</span>
        <img src="${player.avatar}" alt="p" onerror="this.src='https://via.placeholder.com/26'">
        <span class="nickname">${escapeHtml(player.nickname)}</span>
        <span class="score">${player.score} ن</span>
      `;
      finalLeaderboard.appendChild(item);
    });
  } else {
    winnerContainer.innerHTML = '<p style="color: #fff;">لم يتم تسجيل أي نقاط في هذه اللعبة.</p>';
  }
}

$('btn-new-game').addEventListener('click', () => {
  STATE.currentRound = 1;
  STATE.scores = {};
  STATE.revealedWords = [];
  STATE.domainData = null;
  STATE.roundActive = false;
  $('final-modal').style.display = 'none';
  $('leaderboard-list').style.display = 'flex';$('page-game').classList.remove('active');
  $('page-1').classList.add('active');$('btn-start-game').disabled = false;
  setTikTokStatus('success', 'جاهز لبدء لعبة جديدة!');
});

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  initSocket();
});
</script>
</body>
</html>
